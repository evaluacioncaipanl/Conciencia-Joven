<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mapeo · Sesión 3 (prototipo)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --naranja:#f07c1e; --naranja-osc:#c95f0a; --tinta:#1d1d1f; --gris:#6b6b70; --fondo:#fff8f1;
  --riesgo:#e0457b; --riesgo-bg:#fde3ec; --prot:#3d9a4f; --prot-bg:#e2f3e4; --rut:#3b6fd1; --rut-bg:#e3ebfb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:var(--fondo)}
button{font:inherit;cursor:pointer;border:0}
.pantalla{position:fixed;inset:0;display:none}
.pantalla.activa{display:flex}

/* Inicio */
#inicio{flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;background:var(--fondo)}
#inicio .franja{position:absolute;top:0;left:0;right:0;background:var(--naranja);color:#fff;padding:14px 20px;font-weight:700;display:flex;justify-content:space-between}
#inicio h1{margin:0;font-size:clamp(28px,5vw,44px);text-align:center}
#inicio p.sub{margin:0;color:var(--gris);text-align:center;font-size:18px}
.campo{display:flex;flex-direction:column;gap:6px;width:min(420px,100%)}
.campo label{font-weight:700}
.campo input{font:inherit;font-size:20px;padding:14px 16px;border:2px solid #e3d6c8;border-radius:14px;background:#fff}
.campo input:focus{outline:none;border-color:var(--naranja)}
.btn{background:var(--naranja);color:#fff;font-size:22px;font-weight:800;padding:18px 28px;border-radius:18px;width:min(420px,100%);box-shadow:0 4px 0 var(--naranja-osc)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--naranja-osc)}
.btn.sec{background:#fff;color:var(--naranja-osc);border:2px solid var(--naranja);box-shadow:none;font-size:18px;padding:14px}
.aviso{color:#b3261e;font-weight:700;min-height:1.2em}

/* Mapa */
#vista{flex-direction:column}
#map{flex:1;background:#eee}
.sin-etq .ref-tip{display:none}
.franjas button.sel{background:var(--naranja);color:#fff;border-color:var(--naranja-osc)}
.barra{position:absolute;top:12px;left:12px;right:68px;z-index:500;display:flex;gap:10px;align-items:center;pointer-events:none}
.burbuja{pointer-events:auto;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:18px;font-weight:700}
.burbuja.grande{flex:1}
.burbuja small{display:block;font-weight:500;color:var(--gris);font-size:14px}
.barra button{pointer-events:auto}
.bt-mini{background:#fff;border-radius:14px;padding:12px 14px;font-weight:800;box-shadow:0 2px 10px rgba(0,0,0,.18);font-size:16px}
.bt-mini.listo{background:var(--naranja);color:#fff}
.reloj{font-variant-numeric:tabular-nums;color:var(--naranja-osc)}

/* Hoja inferior */
#velo{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:900;display:none}
#hoja{position:absolute;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-radius:24px 24px 0 0;
  box-shadow:0 -6px 24px rgba(0,0,0,.2);padding:16px 18px 22px;transform:translateY(105%);transition:transform .22s ease;max-height:78vh;overflow:auto}
#hoja.abierta{transform:none}
#hoja h2{margin:4px 0 12px;font-size:22px}
.grupo-est{margin-bottom:14px}
.grupo-est h3{margin:0 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.est{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;font-size:16px;font-weight:700;text-align:left;min-height:64px;border:3px solid transparent}
.est .ico{font-size:30px;line-height:1}
.est[disabled]{opacity:.35}
.riesgo .est{background:var(--riesgo-bg)} .riesgo h3{color:var(--riesgo)}
.prot .est{background:var(--prot-bg)} .prot h3{color:var(--prot)}
.rut .est{background:var(--rut-bg)} .rut h3{color:var(--rut)}
.est:active{border-color:var(--tinta)}
.franjas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.franjas button{background:#fff3e6;border-radius:18px;padding:18px 6px;font-size:16px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent}
.franjas button .ico{font-size:38px}
.franjas button:active{border-color:var(--naranja)}
.pie-hoja{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.link{background:none;color:var(--gris);font-weight:700;font-size:16px;padding:10px}
.elegida{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;font-weight:700;margin-bottom:10px}

/* Marcadores */
.marca{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.marca span{transform:rotate(45deg);font-size:22px}
.marca.riesgo{background:var(--riesgo)} .marca.prot{background:var(--prot)} .marca.rut{background:var(--rut)}
.marca.nueva{animation:cae .35s ease-out}
@keyframes cae{from{transform:translateY(-30px) rotate(-45deg);opacity:0}to{transform:rotate(-45deg);opacity:1}}
.ref{background:#fff;border:2px solid var(--tinta);border-radius:10px;padding:2px 7px;font-size:13px;font-weight:800;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ref-pt{display:flex;flex-direction:column;align-items:center;gap:3px}
.ref-pt i{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--tinta)}
.anillo{width:24px;height:24px;border-radius:50%;border:4px solid var(--naranja);background:rgba(240,124,30,.3)}

/* Toast */
#toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%) translateY(140%);z-index:1200;background:var(--tinta);color:#fff;padding:14px 20px;border-radius:14px;font-weight:700;font-size:17px;transition:transform .2s}
#toast.ver{transform:translateX(-50%) translateY(0)}

/* Panel facilitador */
#esquina{position:fixed;top:0;right:0;width:56px;height:56px;z-index:3000}
#panel{position:fixed;inset:0;z-index:4000;background:#fff;display:none;flex-direction:column;padding:18px;overflow:auto}
#panel.ver{display:flex}
#panel h2{margin:0 0 6px}
#panel .fila{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
#panel table{border-collapse:collapse;font-size:13px;width:100%}
#panel th,#panel td{border-bottom:1px solid #eee;padding:6px;text-align:left}
#panel .resumen{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
#panel .caja{background:var(--fondo);border-radius:12px;padding:12px}
#panel .caja b{display:block;font-size:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- INICIO -->
<section id="inicio" class="pantalla activa">
  <div class="franja"><span>Sesión 3 · Mapeo</span><span id="fechaHoy"></span></div>
  <h1>Mapa de mi colonia</h1>
  <p class="sub">Monte Kristal · Juárez, N.L.</p>
  <div class="campo">
    <label for="grupo">Grupo</label>
    <input id="grupo" autocomplete="off" placeholder="Ej. MK-1">
  </div>
  <div class="aviso" id="avisoInicio"></div>
  <button class="btn" id="btEmpezar">Empezar</button>
  <button class="btn sec" id="btPrueba">Prueba de ubicación</button>
</section>

<!-- MAPA -->
<section id="vista" class="pantalla">
  <div id="map"></div>
  <div class="barra" id="barraMapeo">
    <div class="burbuja grande">Toca el mapa donde quieras poner una estampa<small id="contador">0 estampas</small></div>
    <button class="bt-mini" id="btDeshacer">↶ Quitar última</button>
    <button class="bt-mini listo" id="btTerminar">Terminar</button>
  </div>
  <div class="barra" id="barraPrueba" style="display:none">
    <div class="burbuja grande" id="consigna"></div>
    <div class="burbuja reloj" id="reloj">0 s</div>
    <button class="bt-mini" id="btNoSe">No lo encuentro</button>
  </div>
  <div id="velo"></div>
  <div id="hoja"></div>
  <div id="toast"></div>
</section>

<div id="esquina"></div>
<div id="panel"></div>

<script>
/* =========================================================
   PROTOTIPO · Mapeo de rutinas y puntos críticos (Sesión 3)
   - En línea (teselas de OpenStreetMap). La versión sin internet vendrá después.
   - No guarda código de participante: solo grupo, colonia y turno_id anónimo.
   - Guarda en localStorage de esta tablet. No envía a Sheets todavía.
   ========================================================= */
const CONFIG = {
  COLONIA: 'Monte Kristal',
  MUNICIPIO: 'Juárez',
  DECIMALES: 3,          // redondeo de coordenadas al guardar (~100 m)
  TOPE_POR_ESTAMPA: 3,   // máximo de la misma estampa por turno
  TOLERANCIA_M: 150,     // prueba: toque a ≤150 m de su escuela cuenta como acierto
  STORE: 'cj_mapeo_proto_v1'
};

// Límite de la colonia (OSM way 442152656, © colaboradores de OpenStreetMap)
const POLIGONO = [[-100.1500075,25.6072089],[-100.1488228,25.6065269],[-100.1447996,25.6067275],[-100.1424826,25.6067268],[-100.1400536,25.6059366],[-100.1386494,25.6056277],[-100.1381916,25.6058129],[-100.1379424,25.6063279],[-100.1333994,25.6055479],[-100.1331119,25.604162],[-100.132779,25.603552],[-100.1332791,25.6026198],[-100.1254596,25.6009208],[-100.1247093,25.6040256],[-100.1196408,25.6040783],[-100.1188739,25.608213],[-100.1170982,25.6104156],[-100.1172399,25.6118288],[-100.119299,25.6138359],[-100.1176401,25.6150387],[-100.1174156,25.615156],[-100.1190975,25.6173151],[-100.1236136,25.6144031],[-100.127074,25.6108727],[-100.1312594,25.6142874],[-100.1328075,25.6130884],[-100.1350765,25.6140618],[-100.1381399,25.6156084],[-100.138109,25.6165274],[-100.138076,25.6175382],[-100.1378267,25.6226921],[-100.1396043,25.6225142],[-100.1411381,25.6186753],[-100.145067,25.6204068],[-100.1461637,25.6192688],[-100.1455041,25.6189522],[-100.1465078,25.6178682],[-100.1469496,25.6149505],[-100.1488475,25.6149695],[-100.1496336,25.6115915],[-100.1476506,25.6117479],[-100.148488,25.6085466],[-100.1491205,25.6082725],[-100.1500075,25.6072089]];

// Puntos de referencia precargados (el equipo los completa por colonia)
// Fuente: OpenStreetMap (Nominatim), 20 nov 2026. Faltan OXXO, tienditas, canchas y paradas: los completa el equipo.
const REFERENCIAS = [
  {nom:'Telesecundaria 28',ico:'✏️',lat:25.613027,lng:-100.14184},
  {nom:'Sec. Téc. María Lavalle',ico:'✏️',lat:25.615365,lng:-100.13931},
  {nom:'Prim. Alfonso Reyes',ico:'✏️',lat:25.611314,lng:-100.14422},
  {nom:'Prim. Agustín Basave',ico:'✏️',lat:25.618433,lng:-100.14700},
  {nom:'Prim. Beneméritos Educadores',ico:'✏️',lat:25.619647,lng:-100.14037},
  {nom:'Prim. Centenario de la Revolución',ico:'✏️',lat:25.608887,lng:-100.15123},
  {nom:'Parroquia San Judas',ico:'⛪',lat:25.617453,lng:-100.14414},
  {nom:'Bodega Aurrera',ico:'🛒',lat:25.617085,lng:-100.14203},
  {nom:'Bodega Aurrera',ico:'🛒',lat:25.621058,lng:-100.13009},
  {nom:'OXXO',ico:'🏪',lat:25.619136,lng:-100.12949},
  {nom:'Plaza San Martín',ico:'🌳',lat:25.622601,lng:-100.12322},
  {nom:'Parque San Felipe',ico:'🌳',lat:25.621938,lng:-100.12432},
  {nom:'Parque Santa Esmeralda',ico:'🌳',lat:25.616125,lng:-100.13067}
];

// Estampas PROVISIONALES (íconos emoji temporales; Max define la lista e íconos finales)
const ESTAMPAS = [
  {g:'riesgo', t:'Riesgo', items:[
    ['ilum','💡','Poca iluminación'],['rina','⚡','Conflictos o riñas'],['terreno','🏚️','Terreno abandonado'],
    ['consumo','🍺','Consumo de alcohol o drogas'],['calle','🛣️','Calle poco transitada']]},
  {g:'prot', t:'Protección', items:[
    ['iglesia','⛪','Iglesia'],['escuela','✏️','Escuela'],['salud','🏥','Centro de salud'],['comunitario','⭐','Centro comunitario'],
    ['ayuda','❤️','Lugar donde me ayudan'],['parque','🌳','Parque'],['cancha','⚽','Cancha o deporte']]},
  {g:'rut', t:'Mi rutina', items:[
    ['junto','🧑‍🤝‍🧑','Donde me junto'],['parada','🚌','Parada de camión o metro'],['trabajo','💼','Trabajo']]}
];
const FRANJAS = [['manana','🌅','Mañana'],['tarde','☀️','Tarde'],['noche','🌙','Noche'],['finde','🎉','Fin de semana']];
const EST = {}; ESTAMPAS.forEach(gr=>gr.items.forEach(([k,i,n])=>EST[k]={k,ico:i,nom:n,g:gr.g}));
const FR = {}; FRANJAS.forEach(([k,i,n])=>FR[k]={ico:i,nom:n});

const $ = id => document.getElementById(id);
// Si no cargó la librería del mapa (sin internet), se avisa en lugar de dejar la pantalla en blanco
if(typeof maplibregl === 'undefined'){
  document.body.innerHTML = '<div style="padding:40px;font:20px system-ui;text-align:center"><b>No cargó el mapa.</b><br><br>Este prototipo necesita internet. Conecta la tablet y recarga la página.</div>';
  throw new Error('MapLibre no cargó');
}

/* ---------- almacenamiento ---------- */
function leer(){ try{ return JSON.parse(localStorage.getItem(CONFIG.STORE)) || {marcas:[],pruebas:[]}; }catch(e){ return {marcas:[],pruebas:[]}; } }
function guardar(d){ try{ localStorage.setItem(CONFIG.STORE, JSON.stringify(d)); }catch(e){} }
const r = v => Number(v.toFixed(CONFIG.DECIMALES));
const uid = () => Math.random().toString(36).slice(2,8).toUpperCase();

/* ---------- estado ---------- */
let modo = null, grupo = '', turno = null, capaTurno = null, pend = null, relojId = null, t0 = 0;

/* ---------- mapa ----------
   Mapa base: OpenFreeMap (teselas vectoriales gratuitas de datos OSM, sin clave y sin límite de uso).
   Se dejó el servidor tile.openstreetmap.org porque bloquea (403) a apps que no cumplen su política de uso.
   El esquema (OpenMapTiles) es el mismo que tendrá la versión sin internet con PMTiles, así que la prueba se parece al mapa final. */
let lons = POLIGONO.map(p=>p[0]), lats = POLIGONO.map(p=>p[1]);
const limites = [[Math.min(...lons),Math.min(...lats)],[Math.max(...lons),Math.max(...lats)]];
const margen = [[limites[0][0]-0.06,limites[0][1]-0.05],[limites[1][0]+0.06,limites[1][1]+0.05]];
// doubleClickZoom apagado: el doble toque para acercar disparaba un "toque" de estampa sin querer
const map = new maplibregl.Map({ container:'map', style:'https://tiles.openfreemap.org/styles/liberty',
  bounds:limites, fitBoundsOptions:{padding:20}, maxBounds:margen, minZoom:12, maxZoom:19,
  doubleClickZoom:false, dragRotate:false, pitchWithRotate:false, touchPitch:false, attributionControl:{compact:true} });
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
map.on('load', ()=>{
  map.addSource('colonia',{type:'geojson',data:{type:'Feature',geometry:{type:'Polygon',coordinates:[POLIGONO]}}});
  map.addLayer({id:'colonia-fondo',type:'fill',source:'colonia',paint:{'fill-color':'#f07c1e','fill-opacity':0.05}});
  map.addLayer({id:'colonia-borde',type:'line',source:'colonia',paint:{'line-color':'#f07c1e','line-width':4,'line-dasharray':[2,2]}});
});
map.on('error', e=>{ if(e && e.error && /Failed to fetch|NetworkError/i.test(String(e.error.message))) toast('Sin conexión al mapa'); });

// Capa sencilla de marcadores (equivalente a un layerGroup)
class Capa{
  constructor(){ this.m=[]; }
  add(mk){ this.m.push(mk); mk.addTo(map); return mk; }
  clearLayers(){ this.m.forEach(x=>x.remove()); this.m=[]; }
  remove(){ this.clearLayers(); }
  eachLayer(f){ this.m.slice().forEach(f); }
  removeLayer(x){ x.remove(); this.m=this.m.filter(y=>y!==x); }
}
function marcador(ll, html, anchor){
  const el=document.createElement('div'); el.innerHTML=html; el.style.pointerEvents='none';
  return new maplibregl.Marker({element:el, anchor:anchor||'center'}).setLngLat([ll.lng,ll.lat]);
}
// Distancia en metros (haversine)
function distancia(a,b){
  const R=6371000, t=Math.PI/180, dLat=(b.lat-a.lat)*t, dLng=(b.lng-a.lng)*t;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// Las etiquetas de referencia solo se ven de cerca (zoom ≥ 16) para que no se amontonen
function etiquetas(){ $('map').classList.toggle('sin-etq', map.getZoom()<16); }
map.on('zoomend', etiquetas);
const capaRef = new Capa();
function mostrarRef(si){
  capaRef.clearLayers();
  if(si) REFERENCIAS.forEach(p=> capaRef.add(marcador(p,
    `<div class="ref-pt"><span class="ref ref-tip">${p.ico||'📌'} ${p.nom}</span><i></i></div>`,'bottom')));
}
mostrarRef(true);
// Se espera a que la pantalla del mapa tenga tamaño real antes de encuadrar
function encuadrar(){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ map.resize(); map.fitBounds(limites,{padding:20,duration:0}); })); }

/* ---------- pantallas ---------- */
etiquetas();
function ver(id){ document.querySelectorAll('.pantalla').forEach(s=>s.classList.toggle('activa',s.id===id)); }
$('fechaHoy').textContent = new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'});
try{ grupo = sessionStorage.getItem('cj_mapeo_grupo')||''; $('grupo').value = grupo; }catch(e){}

function iniciar(m){
  grupo = $('grupo').value.trim().toUpperCase();
  if(!grupo){ $('avisoInicio').textContent='Escribe el grupo'; $('grupo').focus(); return; }
  $('avisoInicio').textContent='';
  try{ sessionStorage.setItem('cj_mapeo_grupo',grupo); }catch(e){}
  modo = m; turno = uid();
  ver('vista');
  $('barraMapeo').style.display = m==='mapeo'?'flex':'none';
  $('barraPrueba').style.display = m==='prueba'?'flex':'none';
  if(capaTurno) capaTurno.remove();
  capaTurno = new Capa();
  // En la prueba se ocultan nuestras referencias: se mide si se ubican solo con el mapa base de OSM
  mostrarRef(m!=='prueba');
  setTimeout(encuadrar,30);
  if(m==='prueba'){ $('consigna').innerHTML='Elige tu escuela<small>&nbsp;</small>'; $('reloj').textContent='0 s'; setTimeout(empezarPrueba,250); }
  else bitacora({});
  contar();
}
$('btEmpezar').onclick = ()=>iniciar('mapeo');
$('btPrueba').onclick = ()=>iniciar('prueba');

/* ---------- toque en el mapa ---------- */
map.on('click', e=>{
  if(modo==='prueba'){ if(prueba && prueba.paso && !$('hoja').classList.contains('abierta')) confirmarToque(e.lngLat); return; }
  if(modo!=='mapeo' || $('hoja').classList.contains('abierta')) return;
  pend = {latlng:e.lngLat};
  pend.tmp = marcador(e.lngLat,'<div class="anillo"></div>').addTo(map);
  hojaEstampas();
});

function usadas(k){ return leer().marcas.filter(m=>m.turno_id===turno && m.estampa===k).length; }

function hojaEstampas(){
  let h = '<h2>¿Qué hay aquí?</h2>';
  ESTAMPAS.forEach(gr=>{
    h += `<div class="grupo-est ${gr.g}"><h3>${gr.t}</h3><div class="rejilla">`;
    gr.items.forEach(([k,i,n])=>{
      const lleno = usadas(k) >= CONFIG.TOPE_POR_ESTAMPA;
      h += `<button class="est" data-k="${k}" ${lleno?'disabled':''}><span class="ico">${i}</span>${n}</button>`;
    });
    h += '</div></div>';
  });
  h += '<div class="pie-hoja"><button class="link" id="btCancelar">Cancelar</button></div>';
  abrirHoja(h);
  $('hoja').querySelectorAll('.est').forEach(b=>b.onclick=()=>{ pend.k=b.dataset.k; hojaFranja(); });
  $('btCancelar').onclick = cancelar;
}
// Franja: se pueden elegir varias (p. ej. tarde y noche) y se confirma con "Listo"
function hojaFranja(){
  const e = EST[pend.k];
  pend.fr = new Set();
  let h = `<span class="elegida ${e.g}" style="background:var(--${e.g}-bg)">${e.ico} ${e.nom}</span>`;
  h += '<h2>¿Cuándo pasas por aquí? <small style="font-weight:500;color:var(--gris);font-size:15px">Puedes elegir varias</small></h2><div class="franjas">';
  FRANJAS.forEach(([k,i,n])=> h += `<button data-f="${k}"><span class="ico">${i}</span>${n}</button>`);
  h += '</div><div class="pie-hoja"><button class="link" id="btAtras">← Cambiar estampa</button><button class="link" id="btCancelar">Cancelar</button><button class="bt-mini listo" id="btListo" disabled style="opacity:.4">Listo ✓</button></div>';
  abrirHoja(h);
  $('hoja').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f; pend.fr.has(f)?pend.fr.delete(f):pend.fr.add(f);
    b.classList.toggle('sel',pend.fr.has(f));
    $('btListo').disabled = !pend.fr.size; $('btListo').style.opacity = pend.fr.size?1:.4;
  });
  $('btListo').onclick = ()=>{ if(pend.fr.size) colocar(FRANJAS.map(x=>x[0]).filter(k=>pend.fr.has(k))); };
  $('btAtras').onclick = hojaEstampas;
  $('btCancelar').onclick = cancelar;
}
function abrirHoja(html){ $('hoja').innerHTML=html; $('hoja').classList.add('abierta'); $('velo').style.display='block'; }
function cerrarHoja(){ $('hoja').classList.remove('abierta'); $('velo').style.display='none'; }
function cancelar(){ if(pend&&pend.tmp) pend.tmp.remove(); pend=null; cerrarHoja(); }
$('velo').onclick = cancelar;

function pin(ll,e,nueva){ return marcador(ll,`<div class="marca ${e.g}${nueva?' nueva':''}"><span>${e.ico}</span></div>`,'bottom-left'); }

function colocar(fs){
  const e = EST[pend.k], d = leer();
  const m = { id:uid()+uid(), turno_id:turno, grupo, colonia:CONFIG.COLONIA, municipio:CONFIG.MUNICIPIO,
    fecha:new Date().toISOString(), tipo:e.g, estampa:e.k, estampa_nombre:e.nom,
    manana:+fs.includes('manana'), tarde:+fs.includes('tarde'), noche:+fs.includes('noche'), fin_de_semana:+fs.includes('finde'),
    dentro_colonia:+dentro(pend.latlng), lat:r(pend.latlng.lat), lng:r(pend.latlng.lng), zoom:map.getZoom() };
  d.marcas.push(m); guardar(d);
  pend.tmp.remove();
  // se dibuja donde tocó (en pantalla); se guarda redondeado
  capaTurno.add(pin(pend.latlng,e,true))._mid = m.id;
  pend=null; cerrarHoja(); contar();
  toast(`${e.ico} ${e.nom} · ${fs.map(f=>FR[f].nom).join(', ')}`);
}
// ¿El punto cae dentro del polígono de la colonia? (ray casting)
function dentro(ll){
  let x=ll.lng, y=ll.lat, c=false;
  for(let i=0,j=POLIGONO.length-1;i<POLIGONO.length;j=i++){
    const [xi,yi]=POLIGONO[i],[xj,yj]=POLIGONO[j];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
// Bitácora por turno: cuántas estampas quedaron y cuántas se quitaron (fricción)
function bitacora(campos){
  const d = leer(); d.turnos = d.turnos||[];
  let t = d.turnos.find(x=>x.turno_id===turno);
  if(!t){ t={turno_id:turno,grupo,colonia:CONFIG.COLONIA,inicio:new Date().toISOString(),fin:'',estampas:0,quitadas:0}; d.turnos.push(t); }
  Object.entries(campos).forEach(([k,v])=> t[k] = (typeof v==='function')? v(t[k]) : v);
  guardar(d);
}
function contar(){
  const n = leer().marcas.filter(m=>m.turno_id===turno).length;
  $('contador').textContent = n===1?'1 estampa':`${n} estampas`;
}
$('btDeshacer').onclick = ()=>{
  const d = leer(); let idx=-1;
  for(let i=d.marcas.length-1;i>=0;i--) if(d.marcas[i].turno_id===turno){ idx=i; break; }
  if(idx<0) return;
  const id = d.marcas[idx].id; d.marcas.splice(idx,1); guardar(d);
  capaTurno.eachLayer(l=>{ if(l._mid===id) capaTurno.removeLayer(l); });
  bitacora({quitadas:v=>(v||0)+1});
  contar(); toast('Se quitó la última estampa');
};
$('btTerminar').onclick = ()=>{
  const n = leer().marcas.filter(m=>m.turno_id===turno).length;
  if(n===0 && !confirm('No pusieron ninguna estampa. ¿Terminar de todos modos?')) return;
  bitacora({fin:new Date().toISOString(), estampas:n});
  modo=null; ver('inicio'); $('avisoInicio').textContent = n?`¡Gracias! Se guardaron ${n} estampas.`:'';
  $('avisoInicio').style.color = 'var(--prot)';
};

/* ---------- prueba de ubicación (individual: un chico a la vez) ----------
   Paso 1: escuela (control). La escuela declarada se usa solo en la tablet para medir la distancia;
           NO se guarda su nombre ni la coordenada del toque (se evita reidentificar).
   Paso 2: "donde te juntas" (lugar sin etiqueta en OSM). El facilitador valida Sí / No / No sé.
   Al chico no se le dice si atinó, para no contaminar a los demás. */
let prueba = null;
const ESCUELAS = REFERENCIAS.filter(p=>p.ico==='✏️');
function empezarPrueba(){
  prueba = {paso:null, escuela:null, res:{escuela_en_lista:'', atino_escuela:'', seg_escuela:'', atino_lugar:'', seg_lugar:''}};
  let h = '<h2>¿A qué escuela vas?</h2><p style="margin:-6px 0 12px;color:var(--gris)">Contesta tú solo, sin ayuda de tus compañeros.</p><div class="rejilla">';
  ESCUELAS.forEach((p,i)=> h += `<button class="est" data-i="${i}" style="background:#fff3e6"><span class="ico">✏️</span>${p.nom}</button>`);
  h += `<button class="est" data-i="otra" style="background:#eee"><span class="ico">🏫</span>Otra escuela</button>
        <button class="est" data-i="no" style="background:#eee"><span class="ico">➖</span>No estudio</button></div>`;
  abrirHoja(h);
  $('velo').onclick = null;
  $('hoja').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.i; cerrarHoja(); $('velo').onclick = cancelar;
    if(i==='otra'||i==='no'){ prueba.res.escuela_en_lista='no'; prueba.res.atino_escuela='na'; pasoLugar(); }
    else { prueba.escuela = ESCUELAS[+i]; prueba.res.escuela_en_lista='si'; pasoEscuela(); }
  });
}
function consigna(txt,sub){ $('consigna').innerHTML = txt+`<small>${sub}</small>`; t0=Date.now(); clearInterval(relojId);
  relojId=setInterval(()=>$('reloj').textContent=Math.round((Date.now()-t0)/1000)+' s',500); }
function pasoEscuela(){ prueba.paso='escuela'; consigna('📍 Toca en el mapa dónde está <u>tu escuela</u>','Puedes mover y acercar el mapa'); }
function pasoLugar(){ prueba.paso='lugar'; capaTurno.clearLayers(); consigna('📍 Toca dónde <u>te juntas con tus amigos</u>','Un lugar de tu colonia, no tu casa'); }
function confirmarToque(ll){
  const seg = Math.round((Date.now()-t0)/1000);
  capaTurno.clearLayers();
  capaTurno.add(pin(ll,{g:'rut',ico:'📍'},true));
  abrirHoja(`<h2>¿Aquí es?</h2><div class="pie-hoja" style="justify-content:flex-start;gap:12px">
    <button class="btn" style="width:auto" id="pSi">Sí, aquí</button><button class="btn sec" style="width:auto" id="pMover">Mover</button></div>`);
  $('pMover').onclick = ()=>{ capaTurno.clearLayers(); cerrarHoja(); };
  $('pSi').onclick = ()=>{ cerrarHoja(); registrar(ll,seg); };
}
function registrar(ll,seg){
  if(prueba.paso==='escuela'){
    const m = ll? distancia(ll,prueba.escuela) : Infinity;
    prueba.res.atino_escuela = m<=CONFIG.TOLERANCIA_M?'si':'no';
    prueba.res.seg_escuela = seg;
    pasoLugar(); return;
  }
  prueba.res.seg_lugar = seg; clearInterval(relojId);
  if(!ll){ prueba.res.atino_lugar='no'; return terminarPrueba(); }
  // Validación del facilitador (no se guarda la coordenada)
  abrirHoja(`<h2>Facilitador: ¿el lugar marcado es correcto?</h2><p style="margin:-6px 0 12px;color:var(--gris)">Pregúntale al chico qué lugar es y compáralo con el mapa.</p>
    <div class="pie-hoja" style="justify-content:flex-start;gap:12px;flex-wrap:wrap">
    <button class="btn" style="width:auto" data-v="si">Sí</button><button class="btn sec" style="width:auto" data-v="no">No</button>
    <button class="btn sec" style="width:auto" data-v="no_se">No sé</button></div>`);
  $('velo').onclick = null;
  $('hoja').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ prueba.res.atino_lugar=b.dataset.v; cerrarHoja(); $('velo').onclick=cancelar; terminarPrueba(); });
}
function terminarPrueba(){
  const d = leer();
  d.pruebas.push(Object.assign({ id:uid()+uid(), grupo, colonia:CONFIG.COLONIA, fecha:new Date().toISOString() }, prueba.res));
  guardar(d);
  prueba=null; modo=null; capaTurno.clearLayers();
  toast('¡Gracias! Pásale la tablet al siguiente');
  setTimeout(()=>{ ver('inicio'); $('avisoInicio').textContent=''; },1400);
}
$('btNoSe').onclick = ()=>{ if(!prueba||!prueba.paso) return; registrar(null, Math.round((Date.now()-t0)/1000)); };

function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('ver'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('ver'),1800); }

/* ---------- panel del facilitador (5 toques arriba a la derecha) ---------- */
let toques=0, tt=null;
$('esquina').addEventListener('click',()=>{ toques++; clearTimeout(tt); tt=setTimeout(()=>toques=0,1500); if(toques>=5){ toques=0; abrirPanel(); } });
function csv(filas){
  if(!filas.length) return '';
  const cols = Object.keys(filas[0]);
  const esc = v => { v = v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return '﻿'+cols.join(',')+'\n'+filas.map(f=>cols.map(c=>esc(f[c])).join(',')).join('\n');
}
function bajar(nombre,txt){
  if(!txt){ toast('No hay datos para descargar'); return; }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download=nombre; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
function abrirPanel(){
  const d = leer(), P=$('panel');
  d.turnos = d.turnos||[];
  const turnos = d.turnos.length;
  const conEsc = d.pruebas.filter(p=>p.escuela_en_lista==='si');
  const okEsc = conEsc.filter(p=>p.atino_escuela==='si').length;
  const okLug = d.pruebas.filter(p=>p.atino_lugar==='si').length;
  const quitadas = d.turnos.reduce((s,t)=>s+(t.quitadas||0),0);
  const fuera = d.marcas.filter(m=>m.dentro_colonia===0).length;
  const porEst = {}; d.marcas.forEach(m=>porEst[m.estampa_nombre]=(porEst[m.estampa_nombre]||0)+1);
  P.innerHTML = `<h2>Panel del facilitador</h2><div style="color:var(--gris)">Prototipo · datos solo en esta tablet</div>
  <div class="resumen" style="margin-top:14px">
    <div class="caja"><b>${d.marcas.length}</b>estampas</div>
    <div class="caja"><b>${turnos}</b>turnos de mapeo</div>
    <div class="caja"><b>${okLug}/${d.pruebas.length}</b>ubicaron dónde se juntan (umbral 4 de 5)</div>
    <div class="caja"><b>${okEsc}/${conEsc.length}</b>ubicaron su escuela (control)</div>
    <div class="caja"><b>${quitadas}</b>estampas quitadas</div>
    <div class="caja"><b>${fuera}</b>estampas fuera de la colonia</div>
  </div>
  <div class="fila">
    <button class="btn sec" style="width:auto" id="pCsv">Descargar estampas (CSV)</button>
    <button class="btn sec" style="width:auto" id="pCsv2">Descargar prueba (CSV)</button>
    <button class="btn sec" style="width:auto" id="pCsv3">Descargar turnos (CSV)</button>
    <button class="btn sec" style="width:auto" id="pVer">Ver todas en el mapa</button>
    <button class="btn sec" style="width:auto;color:#b3261e;border-color:#b3261e" id="pBorrar">Borrar datos</button>
    <button class="btn" style="width:auto" id="pCerrar">Cerrar</button>
  </div>
  <h3>Estampas por tipo</h3>
  <table><tr><th>Estampa</th><th>Total</th></tr>${Object.entries(porEst).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')||'<tr><td colspan=2>Sin datos</td></tr>'}</table>
  <h3>Prueba de ubicación</h3>
  <table><tr><th>Grupo</th><th>Escuela en lista</th><th>Atinó escuela</th><th>Seg.</th><th>Atinó lugar</th><th>Seg.</th></tr>${d.pruebas.map(p=>`<tr><td>${p.grupo}</td><td>${p.escuela_en_lista}</td><td>${p.atino_escuela}</td><td>${p.seg_escuela}</td><td>${p.atino_lugar}</td><td>${p.seg_lugar}</td></tr>`).join('')||'<tr><td colspan=6>Sin datos</td></tr>'}</table>`;
  P.classList.add('ver');
  $('pCerrar').onclick = ()=>P.classList.remove('ver');
  $('pCsv').onclick = ()=>bajar(`mapeo_estampas_${CONFIG.COLONIA.replace(/\s/g,'_')}.csv`, csv(d.marcas));
  $('pCsv2').onclick = ()=>bajar(`mapeo_prueba_ubicacion_${CONFIG.COLONIA.replace(/\s/g,'_')}.csv`, csv(d.pruebas));
  $('pCsv3').onclick = ()=>bajar(`mapeo_turnos_${CONFIG.COLONIA.replace(/\s/g,'_')}.csv`, csv(d.turnos));
  $('pBorrar').onclick = ()=>{ if(confirm('¿Borrar todas las estampas, pruebas y turnos de esta tablet? No se puede deshacer.')){ guardar({marcas:[],pruebas:[],turnos:[]}); abrirPanel(); } };
  $('pVer').onclick = ()=>{
    P.classList.remove('ver'); modo=null; ver('vista');
    $('barraMapeo').style.display='none'; $('barraPrueba').style.display='none';
    if(capaTurno) capaTurno.remove(); capaTurno=new Capa(); mostrarRef(true);
    leer().marcas.forEach(m=>capaTurno.add(pin({lat:m.lat,lng:m.lng},EST[m.estampa]||{g:m.tipo,ico:'•'},false)));
    setTimeout(encuadrar,30);
    toast('Toca 5 veces la esquina para volver al panel');
  };
}
</script>
</body>
</html>
