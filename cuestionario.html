<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cuestionario de Situaciones Cotidianas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Montserrat:wght@600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una sola columna de lectura (máx. 680px), una pregunta por pantalla, botones grandes para tablet. */
:root{
  --bg:#F4F3F1; --surface:#FFFFFF; --ink:#22201D; --muted:#655F58; --line:#DEDAD4;
  --accent:#F39A4A; --accent-ink:#B4521A; --accent-soft:#FDE9D7; --on-accent:#2A1404; --warn:#B3261E; --warn-soft:#F8E1DE; --ok:#2C7A3F;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --inst:"Montserrat", "Trebuchet MS", system-ui, sans-serif; --field:#8F877D;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#171513; --surface:#211E1B; --ink:#EFEBE6; --muted:#ABA39A; --line:#3A352F;
  --accent:#F5A25A; --accent-ink:#F5A25A; --accent-soft:#3B2414; --on-accent:#2A1404; --warn:#F2958C; --warn-soft:#3A1F1C; --ok:#7FD39A; --field:#7D756C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#171513; --surface:#211E1B; --ink:#EFEBE6; --muted:#ABA39A; --line:#3A352F;
  --accent:#F5A25A; --accent-ink:#F5A25A; --accent-soft:#3B2414; --on-accent:#2A1404; --warn:#F2958C; --warn-soft:#3A1F1C; --ok:#7FD39A; --field:#7D756C; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:20px;padding-bottom:48px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,5vw,38px);font-weight:800}
h2{font-size:clamp(22px,4vw,28px);font-weight:600}
p{margin:0}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.proto{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:15px}
.proto b{color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
label{font-weight:700;font-size:16px;display:block;margin-bottom:6px}
.hint{font-size:14px;color:var(--muted)}
input[type=text]{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.code-input{font-family:var(--mono)!important;letter-spacing:.06em;text-transform:uppercase}
.err{color:var(--warn);font-size:15px;font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:18px;border-radius:12px;padding:14px 22px;border:2px solid transparent;cursor:pointer;min-height:56px}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:disabled{opacity:.35;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--accent-ink);border-color:var(--line)}
.btn-warn{background:transparent;color:var(--warn);border-color:var(--warn)}
.btn-block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;font-weight:700;font-size:18px;min-width:64px;min-height:52px;padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.who .chip{min-height:84px;font-size:22px;font-family:var(--display)}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:99px;transition:width .25s ease}
.qnum{font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent-ink)}
.qtext{font-size:clamp(21px,3.4vw,25px);line-height:1.4;font-weight:700}
.part{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;font:inherit;font-size:19px;line-height:1.4;padding:16px 18px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:64px}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;border:2px solid var(--line);color:var(--muted)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .l{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.yn{flex-direction:row;flex-wrap:wrap}
.yn .opt{flex:1 1 140px;justify-content:center;font-weight:700;font-size:21px}
.nav{display:flex;justify-content:space-between;gap:12px}
.nav .btn-primary{flex:1}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.step{border-top:3px solid var(--accent);padding-top:10px;font-size:15px;color:var(--muted)}
.step b{display:block;color:var(--ink);font-size:16px}
@media (max-width:560px){.steps{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;background:var(--warn-soft);color:var(--warn)}
textarea{width:100%;min-height:110px;font-family:var(--mono);font-size:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px}
.thanks{text-align:center;align-items:center;padding-block:40px}
.thanks h1{font-size:clamp(32px,6vw,46px)}
.linkish{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px}
.foot{display:flex;justify-content:center}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.pill.ok{background:#E3F1E6;color:var(--ok)} .pill.wait{background:var(--accent-soft);color:var(--accent-ink)} .pill.bad{background:var(--warn-soft);color:var(--warn)}
.okbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:15px;color:var(--ok);font-weight:700}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .pill.ok{background:#1D3324} }
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} img{max-width:100%} [hidden]{display:none!important}
/* ===== Propuesta B: pantallas del facilitador, inicio del participante y cierre ===== */
.shell{min-height:100vh;display:flex;flex-direction:column;background:var(--surface)}
.inner{max-width:820px;margin:0 auto;padding-left:max(clamp(16px,7vw,56px), env(safe-area-inset-left,0px));padding-right:max(clamp(16px,7vw,56px), env(safe-area-inset-right,0px))}
.hdr{border-bottom:5px solid var(--accent);background:var(--surface)}
.hdr .inner{padding-block:20px}
.hdr-t{margin:0;font-family:var(--inst);font-weight:700;font-size:16px}
.hdr-s{margin:0;font-size:13px;color:var(--muted)}
.steps-b{background:var(--bg)}
.steps-b .inner{padding-block:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stp{display:flex;align-items:center;gap:10px;font-family:var(--inst);font-weight:700;font-size:15px;line-height:1.2;color:var(--muted)}
.stp .dot{flex:none;width:32px;height:32px;box-sizing:border-box;border-radius:50%;border:2px solid var(--field);display:flex;align-items:center;justify-content:center;font-size:15px}
.stp.cur{color:var(--ink)}
.stp.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stp.hecho .dot{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.stp-d{margin:8px 0 0;font-size:14px;color:var(--muted)}
main.b{flex:1;display:flex;flex-direction:column}
main.b>.inner{width:100%;box-sizing:border-box;padding-block:44px 36px;display:flex;flex-direction:column;gap:32px}
main.b.roomy>.inner{padding-top:72px;gap:36px}
main.b.fin>.inner{flex:1;justify-content:space-between}
.h1b{margin:0;font-family:var(--inst);font-weight:800;font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
.h1b.xl{font-size:clamp(36px,7vw,56px);line-height:1.05;letter-spacing:-.02em}
.sub{margin:0;font-size:16px;color:var(--muted)}
.secb{display:flex;flex-direction:column;gap:4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.secb h2{font-family:var(--inst);font-weight:700;font-size:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{margin:0}
input.inp{width:100%;box-sizing:border-box;font:inherit;font-size:20px;padding:13px 14px;border-radius:8px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink)}
input.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.inp.code{font-weight:700;font-size:clamp(28px,6vw,40px);letter-spacing:.08em;padding:18px 20px;border:2px solid var(--accent);text-transform:uppercase}
.bb{font-family:var(--inst);font-weight:700;font-size:18px;border-radius:8px;padding:16px 22px;min-height:60px;cursor:pointer;border:0}
.bb.pri{background:var(--accent);color:var(--on-accent);width:100%}
.bb.pri:disabled{opacity:.35;cursor:not-allowed}
.bb.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--field)}
.bb:focus-visible,.sexo:focus-visible,.edad button:focus-visible,.lnk:focus-visible{outline:3px solid var(--accent-ink);outline-offset:2px}
.rowb{display:flex;gap:12px}
.rowb .pri{flex:1;width:auto}
.lnk{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;font:inherit;font-size:15px;color:var(--accent-ink);text-decoration:underline;cursor:pointer}
.q{margin:0;font-weight:700;font-size:17px}
.sexos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.sexo{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 22px;font-family:var(--inst);font-weight:700;font-size:22px;min-height:84px;border-radius:8px;border:1.5px solid var(--field);background:var(--surface);color:var(--ink);cursor:pointer}
.sexo .sx-chk{color:var(--accent-ink);visibility:hidden;display:flex}
.sexo .sx-chk svg{width:22px;height:22px}
.sexo[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.sexo[aria-pressed="true"] .sx-chk{visibility:visible}
.edad{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1.5px solid var(--field);border-radius:8px;overflow:hidden}
.edad button{min-height:64px;border:0;border-right:1px solid var(--line);background:var(--surface);font:inherit;font-weight:700;font-size:20px;color:var(--ink);cursor:pointer;padding:0 4px}
.edad button:last-child{border-right:0;font-size:16px;line-height:1.15}
.edad button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.lead{margin:0;max-width:34em;font-size:clamp(20px,3.2vw,24px);line-height:1.55}
.ftr{border-top:1px solid var(--line);background:var(--surface)}
.ftr .inner{padding-block:18px;font-size:13px;color:var(--muted)}
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-top:clamp(16px,6vh,80px)}
.bigchk{width:128px;height:128px;border-radius:50%;background:var(--accent-soft);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--accent-ink)}
.stack{display:flex;flex-direction:column;gap:12px}
@media (max-width:560px){
  .steps-b .inner{grid-template-columns:1fr;gap:10px}
  .grid2{grid-template-columns:1fr}
  .edad{grid-template-columns:repeat(4,minmax(0,1fr))}
  .edad button{border-bottom:1px solid var(--line)}
  .rowb{flex-direction:column-reverse}
}
</style>

</head>

<script>
/* ============ CONTENIDO (tomado de los cuestionarios en papel) ============ */
const YN=["Sí","No"];
const WORK=["No","Sí, menos de 20 horas a la semana","Sí, 20 horas o más a la semana"];
const INSTR={
 H:"A continuación hay situaciones que les pueden pasar a muchos jóvenes. Lee cada una y toca la opción que más se parece a lo que tú harías, no la que crees que se espera. No es un examen y no hay calificación. Toca solo una opción por pregunta.",
 M:"Primero hay unas preguntas sobre ti; toca la respuesta que sea cierta. Después hay situaciones que les pueden pasar a muchas jóvenes: lee cada una y toca la opción que más se parece a lo que tú harías, no la que crees que se espera. No es un examen y no hay calificación. Toca solo una opción por pregunta."
};
const CTX={
 H:[["Actualmente voy a la escuela.",YN],["Después de la escuela, normalmente hay un adulto en mi casa o alguien que sabe dónde estoy.",YN],["Trabajo en algo por lo que me pagan.",WORK],["En el último mes he tomado alcohol o usado alguna droga.",YN],["En mi casa hay peleas fuertes (gritos o golpes) seguido.",YN],["Tengo algún adulto, en mi casa o fuera de ella, con quien puedo hablar si tengo un problema.",YN]],
 M:[["Actualmente voy a la escuela.",YN],["Después de la escuela, normalmente hay un adulto en mi casa o alguien que sabe dónde estoy.",YN],["Trabajo en algo por lo que me pagan.",WORK],["En mi casa, yo cuido a mis hermanos o hago la mayor parte del quehacer.",YN],["En el último mes he tomado alcohol o usado alguna droga.",YN],["En mi casa hay peleas fuertes (gritos o golpes) seguido.",YN],["Tengo algún adulto, en mi casa o fuera de ella, con quien puedo hablar si tengo un problema.",YN]]
};
const SC={
H:[
["Estoy llegando a la escuela y un compañero me propone que nos saltemos las clases. Ese día entregan calificaciones.",["Entro a las primeras clases y luego me salgo.","Entro y lo convenzo de que entre también.","Entro a clases.","Me voy con él y no entro."]],
["Tengo la tarde libre. En el centro comunitario abrieron un taller gratuito, y mis amigos están reunidos en la esquina.",["Paso un rato con los de la esquina y después voy al taller.","Voy al taller.","Me quedo en la esquina.","Voy al taller e invito a un amigo."]],
["Alguien me empuja delante de varias personas y me reta a pelear.",["Le digo que lo arreglamos después, para no quedar mal.","Le digo que no vale la pena y me quedo ahí.","Me retiro sin contestar, aunque digan que tuve miedo.","Acepto pelear."]],
["Llego tarde a casa y mi mamá me regaña fuerte delante de mi hermano menor.",["Le respondo de mala manera, pero me quedo en casa.","No respondo y me encierro en mi cuarto.","Le grito y me salgo a la calle.","Espero a que los dos estemos más tranquilos y hablo con ella."]],
["Un familiar me invita a jugar futbol y, a la misma hora, un amigo me invita a andar por ahí sin un plan.",["Me voy con el conocido.","Voy con mi familiar.","Voy un rato con mi familiar y después alcanzo al conocido.","Le digo que no al conocido y me quedo en casa."]],
["Estoy en una reunión y un amigo me ofrece marihuana.",["Le digo que no, pero me quedo mientras los demás fuman.","Le pregunto qué tan buena es y le digo que tal vez otro día.","Acepto.","Le digo que no y me voy."]],
["Mi mamá me da dinero para pagar un recibo. En la tienda veo tarjetas de regalo para juegos y aplicaciones y botanas.",["Pago el recibo y le devuelvo el cambio a mi mamá.","Compro una tarjeta pequeña, pago el recibo con lo que queda y luego completo.","Pago el recibo y después veo qué puedo comprar con lo que sobra.","Uso el dinero en lo que quiero y después lo repongo."]],
["En un juego en línea, un desconocido me regala artículos del juego y me pide mis redes sociales para platicar.",["Acepto los regalos y le digo que después le paso mis redes.","Le paso mis redes y seguimos platicando.","No le respondo.","Rechazo los regalos y lo bloqueo."]],
["En un negocio de chatarra compran cables y piezas de autos sin preguntar de dónde vienen. Un amigo sabe dónde conseguirlos y me invita.",["Le pregunto cuánto pagan, solo para saber.","Le digo que no y me voy de ahí.","Acepto ir con él para ganar dinero.","Le digo que no me interesa."]],
["Es fin de semana por la noche. Mi mamá está trabajando y estoy solo en casa. Me invitan a salir.",["Me quedo en casa.","Salgo sin avisar y regreso a la hora que quiero.","Salgo un rato sin avisar y regreso antes de que llegue.","Le pido permiso a mi mamá y salgo solo si me lo da."]],
["Mis amigos van a ir a una fiesta en otra colonia sin estar invitados. Si no voy, se van a burlar de mí en el chat del grupo.",["No voy, aunque se burlen.","Les digo que sí voy para que no se burlen, pero no llego.","No voy y me quedo con un amigo que tampoco quiere ir.","Voy con ellos."]],
["En la calle hay una pelea entre dos personas. Se junta gente y muchos graban con el celular.",["Grabo y animo la pelea.","Busco a un adulto para que los separe.","Me quedo a ver, sin grabar.","Sigo mi camino."]],
["Quiero ganar dinero para ayudar en casa o comprar mis cosas. Me ofrecen varios trabajos.",["Acepto uno por las tardes, después de la escuela (repartir, lavar autos o ayudar en un negocio familiar).","Acepto uno de tiempo completo y dejo la escuela.","Acepto cuidar material de construcción de noche, solo, con pago en efectivo.","No acepto ninguno y sigo estudiando."]],
["Voy perdiendo en un videojuego y se corta el internet. En ese momento, mi hermano menor me pide ayuda con su tarea.",["Aviento o rompo algo, o me desquito con él.","Salgo un momento a calmarme y después lo ayudo.","Le respondo de mala manera.","Le digo que ahora no y me quedo en mi cuarto."]],
["Un adulto que está afuera de un bar me invita a entrar con él y me dice que nadie me va a pedir identificación.",["Le digo que no, pero me quedo platicando afuera del bar.","Entro y tomo con él.","Entro solo a ver, sin tomar.","Le digo que no y me voy a casa."]],
["En redes sociales me ofrecen un trabajo fácil que paga mucho dinero a la semana.",["Lo bloqueo y se lo cuento a alguien de confianza.","Pregunto de qué se trata, sin dar mis datos.","Lo ignoro.","Respondo y mando mis datos."]],
["Mi mamá nota que algo me pasa y me dice que puedo contarle cualquier cosa.",["Le digo que ahora no, que después le platico.","Le digo que no se meta y me salgo.","Le cuento, aunque sea una parte.","Le digo que no es nada y cambio el tema."]],
["A un amigo le robaron algo. Mis amigos quieren ir a golpear al que lo hizo.",["No voy y propongo otra solución, como hablar con él o avisarle a alguien.","Voy solo a ver, sin meterme.","Voy y participo en la pelea.","No voy y pongo un pretexto."]],
["Un amigo me lleva a convivir con unos conocidos suyos que venden droga, solo para pasar el rato.",["Me quedo un rato, pero no regreso.","Me voy con un pretexto.","Me voy con un pretexto y le digo a mi amigo que no quiero juntarme con ellos.","Me quedo y me hago amigo de ellos."]],
["Un prefecto revisa solo mi mochila, delante de todos, para avergonzarme.",["Dejo que la revise y le pregunto con calma por qué solo a mí.","La abro de mala gana y me burlo de él delante de todos.","Lo enfrento o me salgo de la escuela.","Dejo que la revise y después me quejo con la orientadora."]],

function filaCaptura(r){
  const cols=[r.codigo,r.version,r.fecha,r.grupo,r.colonia,r.edad==="18 o más"?"18+":r.edad,r.apodo];
  for(let k=0;k<40;k++)cols.push(r.resp[k]??"");
  return cols;
}
async function enviar(r){
  const body={token:CONFIG.SHEETS_TOKEN,tipo:"cuestionario",record:{id:r.id,codigo:r.codigo,version:r.version,fila:filaCaptura(r),
    tiempos:r.tiempos,fecha:r.fecha,hora_inicio:r.hora_inicio,hora_fin:r.hora,duracion_seg:r.dur,app_version:CONFIG.APP_VERSION}};
  try{
    const res=await fetch(CONFIG.SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    if(!res.ok)return "pendiente";
    const j=await res.json();
    if(j.ok)return "enviado";
    if(/^codigo_|datos_|falta_/.test(j.error||""))return "rechazado:"+j.error;
    return "pendiente";
  }catch(e){return "pendiente"}
}
let syncing=false;
async function sincronizar(){
  if(syncing)return; syncing=true;
  try{
    for(const r of mem.registros){
      if(r.estado==="pendiente"){r.estado=await enviar(r);save();}
    }
  }finally{syncing=false; if(S.screen==="panel"||S.screen==="inicio"||S.screen==="fin")render();}
}
window.addEventListener("online",sincronizar);
setInterval(()=>{if(navigator.onLine!==false&&mem.registros.some(r=>r.estado==="pendiente"))sincronizar()},60000);

async function validarCodigo(cod){
  if(cod==="PRUEBA")return {valido:true};
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),7000);
  try{
    const res=await fetch(CONFIG.SHEETS_URL+"?tipo=cuestionario&codigo="+encodeURIComponent(cod),{signal:ctl.signal});
    const j=await res.json();clearTimeout(to);
    return j.ok?{valido:!!j.valido,motivo:j.motivo}:{sinConexion:true};
  }catch(e){clearTimeout(to);return {sinConexion:true}}
}

  return shell(2,false,true,`<div class="fld" style="gap:6px"><p class="sub">Instrucciones</p><h1 class="h1b xl">Hola, ${esc(S.apodo)}</h1></div>
  <p class="lead">${INSTR_TXT}</p>
  <button class="bb pri" id="go">Empezar</button>`,"roomy");
}
/* ---- Pantalla de pregunta (sin encabezado ni pasos) ---- */
function pregunta(){
  const qs=QS[S.v], i=S.i, q=qs[i], total=qs.length, sel=S.r[i];
  const isYN=q.kind==="ctx";
  const part=isYN?"Preguntas sobre ti":"Situaciones";
  const opts=q.o.map((o,k)=>{
    const val=isYN?o:"abcd"[k];
    const lab=isYN?"":`<span class="l">${"abcd"[k]}</span>`;
    return `<button class="opt" role="radio" aria-checked="${sel===val}" data-val="${esc(val)}">${lab}<span>${esc(o)}</span></button>`;
  }).join("");
  return `<div class="wrap"><div class="bar"><div class="bar-top"><span class="part">${part}</span><span>${i+1} de ${total}</span></div>
    <div class="track"><div class="fill" style="width:${(i/total)*100}%"></div></div></div>
  <div class="card">
    <p class="qnum">${i+1}.</p>
    <p class="qtext">${esc(q.t)}</p>
    <div class="opts ${isYN&&q.o.length===2?"yn":""}" role="radiogroup">${opts}</div>
  </div>
  <div class="nav"><button class="btn btn-ghost" id="back" ${i===0?"disabled":""}>Atrás</button>
  <button class="btn btn-primary" id="go" ${sel?"":"disabled"}>${i===total-1?"Terminar":"Siguiente"}</button></div></div>`;
}
/* ---- Pantalla 3: cierre ---- */
function fin(){
  return shell(3,false,true,`<div class="done">
    <div class="bigchk"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <p class="sub" style="font-size:18px">Listo</p>
    <h1 class="h1b xl">¡Gracias por contestar!</h1>
  </div>
  <div class="stack"><button class="bb pri" id="next">Siguiente participante</button><button class="bb sec" id="home" style="width:100%">Ir al inicio</button></div>`,"fin");
}

/* ---- Panel del facilitador ---- */
function estadoPill(e){
  if(e==="enviado")return `<span class="pill ok">Enviado</span>`;
  if(e==="pendiente")return `<span class="pill wait">Sin enviar</span>`;
  const m=String(e).split(":")[1]||"";
  return `<span class="pill bad" title="${esc(MOTIVOS[m]||m)}">Rechazado</span>`;
}
function panel(){
  const rs=mem.registros;
  const rows=rs.map(r=>`<tr><td>${esc(r.codigo)}</td><td>${r.version}</td><td>${esc(r.apodo)}</td><td>${esc(r.edad)}</td><td>${esc(r.grupo)}</td><td>${r.hora.slice(0,5)}</td><td>${Math.round(r.dur/6)/10} min</td><td>${estadoPill(r.estado)}</td></tr>`).join("");
  const rech=rs.filter(r=>String(r.estado).startsWith("rechazado"));
  const tsv=rs.filter(r=>r.estado!=="enviado").map(r=>filaCaptura(r).map(c=>String(c).replace(/\t|\n/g," ")).join("\t")).join("\n");
  const pend=rs.filter(r=>r.estado==="pendiente").length, env=rs.filter(r=>r.estado==="enviado").length;
  return `${hdr(true)}<div class="wrap"><div><p class="eyebrow">Facilitador</p><h2>Panel de esta tablet</h2></div>
  <div class="card">
    ${rs.length?`<div class="tablewrap"><table><thead><tr><th>Código</th><th>Versión</th><th>Apodo</th><th>Edad</th><th>Grupo</th><th>Hora</th><th>Duración</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="hint">Todavía no hay cuestionarios en esta tablet. Cuando alguien termine, aparecerá aquí con su código, hora y estado de envío.</p>`}
    ${rech.length?`<div class="proto"><span>⚠</span><span>${rech.map(r=>`<b>${esc(r.codigo)}:</b> ${esc(MOTIVOS[String(r.estado).split(":")[1]]||"rechazado")}`).join("<br>")}<br>Revisa el código en la lista y captúralo a mano con las filas de abajo.</span></div>`:""}
    <div class="row"><button class="btn btn-primary" id="sync" ${pend?"":"disabled"}>Reintentar envío (${pend})</button></div>
  </div>
  <div class="card">
    <h2>Respaldo: filas para Captura</h2>
    <p class="hint">Solo los que no se han enviado. Si algo no llega a la base, cópialos y pégalos en la pestaña Captura, columna A de la primera fila vacía. Salen en el mismo orden (código, versión, fecha, grupo, colonia, edad, apodo, P1…P40).</p>
    <textarea id="tsv" readonly>${esc(tsv)}</textarea>
    <div class="row"><button class="btn btn-ghost" id="copy" ${tsv?"":"disabled"}>Copiar filas</button><button class="btn btn-ghost" id="csv" ${rs.length?"":"disabled"}>Descargar CSV (todos)</button><span class="hint" id="copied" hidden>Copiado.</span></div>
  </div>
  <div class="card">
    <h2>Limpiar esta tablet</h2>
    <p class="hint">Borra de la tablet solo lo que ya está en la base.</p>
    <div class="row" id="delrow"><button class="btn btn-warn" id="del" ${env?"":"disabled"}>Borrar ${env} enviado${env===1?"":"s"}</button></div>
  </div>
  <button class="btn btn-ghost btn-block" id="home">Volver al inicio</button></div>`;
}
function descargarCSV(){
  const head=["CÓDIGO","VERSIÓN (H/M)","FECHA","GRUPO","COLONIA","EDAD","APODO"];for(let k=1;k<=40;k++)head.push("P"+k);head.push("estado_envio","id","duracion_seg");
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(",")].concat(mem.registros.map(r=>filaCaptura(r).concat([r.estado,r.id,r.dur]).map(q).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cuestionarios_"+today()+".csv";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ============ EVENTOS ============ */
function bind(){
  const $=id=>document.getElementById(id);
  if(S.screen==="inicio"){
    $("go").onclick=()=>{const g=$("grupo").value.trim(),c=$("colonia").value.trim();
      if(!g||!c){$("e1").hidden=false;return}
      mem.sesion={grupo:g,colonia:c};save();S={screen:"codigo"};render();};
    $("topanel").onclick=()=>{S={screen:"panel"};render()};
  }
  if(S.screen==="codigo"){
    const inp=$("cod");inp.focus();
    const err=t=>{$("e2").textContent=t;$("e2").hidden=false;$("chk").hidden=true;$("go").disabled=false};
    inp.oninput=()=>{S.cod=inp.value;$("e2").hidden=true};
    $("back").onclick=()=>{S={screen:"inicio"};render()};
    $("go").onclick=async()=>{const c=normCode(inp.value);inp.value=c;
      if(c!=="PRUEBA"&&!CODE_RE.test(c))return err("Ese código no tiene el formato CJ-0000. Revísalo en la lista.");
      if(c!=="PRUEBA"&&mem.registros.some(r=>r.codigo===c&&!String(r.estado).startsWith("rechazado")))return err("Ese código ya se usó en esta tablet. Revisa la lista de asistencia.");
      $("go").disabled=true;$("chk").hidden=false;
      const v=await validarCodigo(c);
      if(v.valido===false){
        if(v.motivo==="no_existe")return err("Ese código no existe en la lista de códigos.");
        if(v.motivo==="capturado")return err("Ese código ya tiene un cuestionario en la base.");
        if(v.motivo==="usado_en_juego")return err("Ese código ya se usó en el videojuego. Revisa la lista de asistencia.");
        return err("No se puede usar ese código.");
      }
      S={screen:"perfil",cod:c,sinConexion:!!v.sinConexion};render();};
  }
  if(S.screen==="perfil"){
    document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.apodo=$("apodo").value;S.v=S.v===b.dataset.v?null:b.dataset.v;render()});
    document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{S.apodo=$("apodo").value;S.edad=S.edad===b.dataset.age?null:b.dataset.age;render()});
    const ap=$("apodo");
    ap.oninput=()=>{S.apodo=ap.value;$("go").disabled=!(S.v&&S.edad&&ap.value.trim())};
    $("go").onclick=()=>{S.apodo=ap.value.trim();S.screen="instrucciones";render()};
  }
  if(S.screen==="instrucciones"){
    $("go").onclick=()=>{S.screen="pregunta";S.i=0;S.r=[];S.t=[];S.t0=Date.now();S.ini=new Date();S.qStart=Date.now();render()};
  }
  if(S.screen==="pregunta"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.r[S.i]=b.dataset.val;
      document.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b));$("go").disabled=false});
    $("back").onclick=()=>{if(S.i>0){S.i--;S.qStart=Date.now();render()}};
    $("go").onclick=()=>{S.t[S.i]=Math.round((Date.now()-S.qStart)/100)/10;
      if(S.i<QS[S.v].length-1){S.i++;S.qStart=Date.now();render();}
      else{const now=new Date();
        const r={id:uid(),codigo:S.cod,version:S.v,fecha:today(),grupo:mem.sesion.grupo,colonia:mem.sesion.colonia,
          edad:S.edad,apodo:S.apodo,resp:S.r.slice(),tiempos:S.t.slice(),hora_inicio:hhmm(S.ini),hora:hhmm(now),
          dur:Math.round((Date.now()-S.t0)/1000),estado:"pendiente"};
        mem.registros.push(r);save();S={screen:"fin"};render();sincronizar();}};
  }
  if(S.screen==="fin"){
    $("next").onclick=()=>{S={screen:"codigo"};render()};
    $("home").onclick=()=>{S={screen:"inicio"};render()};
  }
  if(S.screen==="panel"){
    $("home").onclick=()=>{S={screen:"inicio"};render()};
    $("sync").onclick=()=>{$("sync").disabled=true;$("sync").textContent="Enviando…";sincronizar()};
    const c=$("copy");
    if(c)c.onclick=()=>{const ta=$("tsv");const done=()=>{$("copied").hidden=false};
      try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();done()})}catch(e){ta.select();done()}};
    const v=$("csv"); if(v)v.onclick=descargarCSV;
    const d=$("del");
    if(d)d.onclick=()=>{$("delrow").innerHTML=`<span class="hint" style="align-self:center">¿Seguro? No se puede deshacer.</span><button class="btn btn-warn" id="del2">Sí, borrar</button><button class="btn btn-ghost" id="cancel">Cancelar</button>`;
      $("del2").onclick=()=>{mem.registros=mem.registros.filter(r=>r.estado!=="enviado");save();render()};$("cancel").onclick=()=>render();};
  }
}
render();
sincronizar();
</script>
</body>
</html>
