:root {
  --color-paper: oklch(95.7% 0.013 82); --color-paper-2: oklch(92.8% 0.021 79); --color-paper-3: oklch(99.4% 0.007 89);
  --color-ink: oklch(21% 0.011 81); --color-ink-2: oklch(30% 0.013 78); --color-muted: oklch(50% 0.017 64);
  --color-rule: oklch(89.7% 0.02 80); --color-white: oklch(99.5% 0.003 82);
  --color-accent: oklch(56% 0.225 2); --color-accent-deep: oklch(49% 0.205 2); --color-accent-2: oklch(87.6% 0.179 119);
  --color-accent-ink: oklch(99.5% 0.003 82); --color-focus: oklch(56% 0.225 2); --color-ok: oklch(45% 0.12 145);
  --font-display: "Bowlby One SC", "Arial Black", sans-serif; --font-body: "Sofia Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono: ui-monospace, Consolas, monospace;
  --radius-card: 18px; --radius-pill: 999px; --rule-bar: 2px;
  --shadow-card: 5px 6px 0 var(--color-ink); --shadow-sm: 3px 4px 0 var(--color-ink); --shadow-press: 1px 1px 0 var(--color-ink);
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-sm: 0.875rem; --text-md: 1rem; --text-lg: 1.2rem; --text-xl: 1.44rem; --text-2xl: 1.728rem; --text-3xl: 2.488rem; --text-4xl: 3.583rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --dur-micro: 120ms; --dur-short: 220ms;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; overflow-x: clip; }
body { min-height: 100dvh; background: var(--color-paper); color: var(--color-ink); font-family: var(--font-body); font-size: 18px; line-height: 1.5; font-variant-numeric: tabular-nums;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; transition: none; }
::selection { background: var(--color-accent-2); color: var(--color-ink); }
.titulo { margin: 0; font-family: var(--font-display); font-weight: 400; line-height: 1.02; letter-spacing: 0.005em; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }

/* ---------- armazón ---------- */
.pant { min-height: 100dvh; display: flex; flex-direction: column; }
.cinta { display: flex; justify-content: space-between; align-items: center; gap: var(--space-md); flex-wrap: wrap; padding: var(--space-sm) clamp(16px, 5vw, var(--space-2xl)); background: var(--color-ink); color: var(--color-paper); }
.cinta b { font-family: var(--font-display); font-weight: 400; font-size: var(--text-lg); }
.cinta .f { font-weight: 600; color: var(--color-rule); }
.estado { display: flex; gap: var(--space-sm); flex-wrap: wrap; align-items: center; }
.cuerpo { flex: 1; width: min(1120px, 100%); margin: 0 auto; padding: var(--space-xl) clamp(16px, 5vw, var(--space-2xl)); display: flex; flex-direction: column; gap: var(--space-lg); }
.dos { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr); gap: var(--space-xl); align-items: center; flex: 1; }
.pie { padding: var(--space-md) clamp(16px, 5vw, var(--space-2xl)); font-size: var(--text-sm); color: var(--color-muted); border-top: var(--rule-bar) dashed var(--color-rule); }
.lead { font-size: clamp(1.2rem, 2.6vw, 1.5rem); line-height: 1.5; max-width: 34em; color: var(--color-ink-2); }
.sub { font-size: var(--text-lg); color: var(--color-ink-2); }
@media (max-width: 860px) { .dos { grid-template-columns: minmax(0, 1fr); align-items: start; } }

/* ---------- controles ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs); min-height: 56px; padding: 0 var(--space-xl); border-radius: var(--radius-pill); font-weight: 700; font-size: var(--text-lg); color: var(--color-ink); background: var(--color-paper); box-shadow: inset 0 0 0 2px var(--color-ink);
  transition: translate var(--dur-micro) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out); }
.btn:hover { background: var(--color-paper-3); }
.btn:active { translate: 1px 1px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; translate: none; }
.btn--tinta { background: var(--color-ink); color: var(--color-paper); box-shadow: 0 0 0 5px var(--color-white), var(--shadow-card); }
.btn--tinta:hover { background: var(--color-ink-2); }
.btn--tinta:active { translate: 4px 5px; box-shadow: 0 0 0 5px var(--color-white), var(--shadow-press); }
.btn--tinta:disabled { background: var(--color-paper-2); color: var(--color-muted); box-shadow: 0 0 0 5px var(--color-white); }
.btn--peligro { color: var(--color-accent-deep); box-shadow: inset 0 0 0 2px var(--color-accent-deep); }
.btn--chico { min-height: 48px; padding: 0 var(--space-lg); font-size: var(--text-md); }
.btn--ancho { width: 100%; }
.btn--texto { align-self: flex-start; min-height: 44px; padding: 0; background: none; box-shadow: none; font-size: var(--text-md); text-decoration: underline; text-decoration-color: var(--color-accent); text-underline-offset: 4px; }
.btn--texto:hover { background: none; text-decoration-thickness: 2px; }
.btn--texto svg { width: 18px; height: 18px; }
.acciones { display: flex; gap: var(--space-md); flex-wrap: wrap; align-items: center; }
.acciones .btn--tinta { flex: 1; }
.chip { display: inline-flex; align-items: center; min-height: 32px; padding: 0 var(--space-sm); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 700; white-space: nowrap; }
.chip--lima { background: var(--color-accent-2); color: var(--color-ink); box-shadow: 0 0 0 3px var(--color-white); }
.chip--rosa { background: var(--color-accent); color: var(--color-accent-ink); box-shadow: 0 0 0 3px var(--color-white); }

function filaCaptura(r){
  const cols=[r.codigo,r.version,r.fecha,r.grupo,r.colonia,r.edad==="18 o más"?"18+":r.edad,r.apodo];
  for(let k=0;k<40;k++)cols.push(r.resp[k]??"");
  return cols;
}
async function enviar(r){
  const body={token:CONFIG.SHEETS_TOKEN,tipo:"cuestionario",record:{id:r.id,codigo:r.codigo,version:r.version,fila:filaCaptura(r),
    tiempos:r.tiempos,fecha:r.fecha,hora_inicio:r.hora_inicio,hora_fin:r.hora,duracion_seg:r.dur,app_version:CONFIG.APP_VERSION}};
  try{
    const res=await fetch(CONFIG.SHEETS_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
    if(!res.ok)return "pendiente";
    const j=await res.json();
    if(j.ok)return "enviado";
    if(/^codigo_|datos_|falta_/.test(j.error||""))return "rechazado:"+j.error;
    return "pendiente";
  }catch(e){return "pendiente"}
}
let syncing=false;
async function sincronizar(){
  if(syncing)return; syncing=true;
  try{
    for(const r of mem.registros){
      if(r.estado==="pendiente"){r.estado=await enviar(r);save();}
    }
  }finally{syncing=false; if(S.screen==="panel")render(); else pintarEstado();}
}
window.addEventListener("online",sincronizar);
setInterval(()=>{if(navigator.onLine!==false&&mem.registros.some(r=>r.estado==="pendiente"))sincronizar()},60000);

async function validarCodigo(cod){
  if(cod==="PRUEBA")return {valido:true};
  const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),7000);
  try{
    const res=await fetch(CONFIG.SHEETS_URL+"?tipo=cuestionario&codigo="+encodeURIComponent(cod),{signal:ctl.signal});
    const j=await res.json();clearTimeout(to);
    return j.ok?{valido:!!j.valido,motivo:j.motivo}:{sinConexion:true};
  }catch(e){clearTimeout(to);return {sinConexion:true}}
}

  const m=String(e).split(":")[1]||"";

}

  const rows=rs.map(r=>`<tr><td>${esc(r.codigo)}</td><td>${r.version}</td><td>${esc(r.apodo)}</td><td>${esc(r.edad)}</td><td>${esc(r.grupo)}</td><td>${r.hora.slice(0,5)}</td><td>${Math.round(r.dur/6)/10} min</td><td>${estadoPill(r.estado)}</td></tr>`).join("");
  const rech=rs.filter(r=>String(r.estado).startsWith("rechazado"));
  const tsv=rs.filter(r=>r.estado!=="enviado").map(r=>filaCaptura(r).map(c=>String(c).replace(/\t|\n/g," ")).join("\t")).join("\n");
  const pend=rs.filter(r=>r.estado==="pendiente").length, env=rs.filter(r=>r.estado==="enviado").length;
  return pagina(cinta("Panel de control",`<span class="f">${TITULO} ${CONFIG.APP_VERSION}</span>`),`
  ${tit("h1","panel__titulo","Panel de esta tablet")}
  <section class="caja troquel">
    ${rs.length?`<div class="tabla"><table><thead><tr><th>Código</th><th>Versión</th><th>Apodo</th><th>Edad</th><th>Grupo</th><th>Hora</th><th>Duración</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<p class="nota">Todavía no hay cuestionarios en esta tablet.</p>`}
    ${rech.length?`<div class="aviso"><span>${rech.map(r=>`<b>${esc(r.codigo)}:</b> ${esc(MOTIVOS[String(r.estado).split(":")[1]]||"rechazado")}`).join("<br>")}<br>Revisa el código en la lista y captúralo a mano con las filas de abajo.</span></div>`:""}
    ${rs.length&&!pend&&!rech.length?`<p class="okbox">Todos los cuestionarios de esta tablet ya están en la base.</p>`:""}
    <div class="acciones"><button class="btn btn--tinta btn--chico" id="sync" ${pend?"":"disabled"}>Reintentar envío (${pend})</button></div>
  </section>
  <section class="caja troquel">
    <h2>Respaldo: filas para Captura</h2>
    <textarea id="tsv" readonly aria-label="Filas para Captura">${esc(tsv)}</textarea>
    <div class="acciones"><button class="btn btn--chico" id="copy" ${tsv?"":"disabled"}>Copiar filas</button><button class="btn btn--chico" id="csv" ${rs.length?"":"disabled"}>Descargar CSV (todos)</button><span class="nota" id="copied" hidden>Copiado.</span></div>
  </section>
  <section class="caja troquel">
    <h2>Limpiar esta tablet</h2>
    <div class="acciones" id="delrow"><button class="btn btn--peligro btn--chico" id="del" ${env?"":"disabled"}>Borrar ${env} enviado${env===1?"":"s"}</button></div>
  </section>
  <div class="acciones"><button class="btn" id="home">Volver al inicio</button></div>`,true);
}
function descargarCSV(){
  const head=["CÓDIGO","VERSIÓN (H/M)","FECHA","GRUPO","COLONIA","EDAD","APODO"];for(let k=1;k<=40;k++)head.push("P"+k);head.push("estado_envio","id","duracion_seg");
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const lines=[head.map(q).join(",")].concat(mem.registros.map(r=>filaCaptura(r).concat([r.estado,r.id,r.dur]).map(q).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cuestionarios_"+today()+".csv";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

/* ============ EVENTOS ============ */
function bind(){
  const $=id=>document.getElementById(id);
  if(S.screen==="inicio"){
    $("go").onclick=()=>{const g=$("grupo").value.trim(),c=$("colonia").value.trim();
      if(!g||!c){$("e1").hidden=false;return}
      mem.sesion={grupo:g,colonia:c};save();S={screen:"codigo"};render();};
    $("topanel").onclick=()=>{S={screen:"panel"};render()};
  }
  if(S.screen==="codigo"){
    const inp=$("cod");inp.focus();
    const err=t=>{$("e2").textContent=t;$("e2").hidden=false;$("chk").hidden=true;$("go").disabled=false};
    inp.oninput=()=>{S.cod=inp.value;$("e2").hidden=true};
    $("back").onclick=()=>{S={screen:"inicio"};render()};
    $("go").onclick=async()=>{const c=normCode(inp.value);inp.value=c;
      if(c!=="PRUEBA"&&!CODE_RE.test(c))return err("Ese código no tiene el formato CJ-XXXX. Revísalo en la lista.");
      if(c!=="PRUEBA"&&mem.registros.some(r=>r.codigo===c&&!String(r.estado).startsWith("rechazado")))return err("Ese código ya se usó en esta tablet. Revisa la lista de asistencia.");
      $("go").disabled=true;$("chk").hidden=false;
      const v=await validarCodigo(c);
      if(v.valido===false){
        if(v.motivo==="no_existe")return err("Ese código no existe en la lista de códigos.");
        if(v.motivo==="capturado")return err("Ese código ya tiene un cuestionario en la base.");
        if(v.motivo==="usado_en_juego")return err("Ese código ya se usó en el videojuego. Revisa la lista de asistencia.");
        return err("No se puede usar ese código.");
      }
      S={screen:"perfil",cod:c,sinConexion:!!v.sinConexion};render();};
  }
  if(S.screen==="perfil"){
    const listo=()=>{$("go").disabled=!(S.v&&S.edad&&$("apodo").value.trim())};
    document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{S.v=S.v===b.dataset.v?null:b.dataset.v;
      document.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed",String(S.v===x.dataset.v)));listo()});
    document.querySelectorAll("[data-age]").forEach(b=>b.onclick=()=>{S.edad=S.edad===b.dataset.age?null:b.dataset.age;
      document.querySelectorAll("[data-age]").forEach(x=>x.setAttribute("aria-pressed",String(S.edad===x.dataset.age)));listo()});
    const ap=$("apodo");
    ap.oninput=()=>{S.apodo=ap.value;$("go").disabled=!(S.v&&S.edad&&ap.value.trim())};
    $("go").onclick=()=>{S.apodo=ap.value.trim();S.screen="instrucciones";render()};
  }
  if(S.screen==="instrucciones"){
    $("go").onclick=()=>{S.screen="pregunta";S.i=0;S.r=[];S.t=[];S.t0=Date.now();S.ini=new Date();S.qStart=Date.now();render()};
  }
  if(S.screen==="pregunta"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.r[S.i]=b.dataset.val;
      document.querySelectorAll(".opt").forEach(x=>{x.setAttribute("aria-checked",x===b);x.classList.remove("pegar")});
      void b.offsetWidth;b.classList.add("pegar");$("go").disabled=false});
    $("back").onclick=()=>{if(S.i>0){S.i--;S.qStart=Date.now();render()}};
    $("go").onclick=()=>{S.t[S.i]=Math.round((Date.now()-S.qStart)/100)/10;
      if(S.i<QS[S.v].length-1){S.i++;S.qStart=Date.now();render();}
      else{const now=new Date();
        const r={id:uid(),codigo:S.cod,version:S.v,fecha:today(),grupo:mem.sesion.grupo,colonia:mem.sesion.colonia,
          edad:S.edad,apodo:S.apodo,resp:S.r.slice(),tiempos:S.t.slice(),hora_inicio:hhmm(S.ini),hora:hhmm(now),
          dur:Math.round((Date.now()-S.t0)/1000),estado:"pendiente"};
        mem.registros.push(r);save();S={screen:"fin"};render();sincronizar();}};
  }
  if(S.screen==="fin"){
    $("next").onclick=()=>{S={screen:"codigo"};render()};
    $("home").onclick=()=>{S={screen:"inicio"};render()};
  }
  if(S.screen==="panel"){
    $("home").onclick=()=>{S={screen:"inicio"};render()};
    $("sync").onclick=()=>{$("sync").disabled=true;$("sync").textContent="Enviando…";sincronizar()};
    const c=$("copy");
    if(c)c.onclick=()=>{const ta=$("tsv");const done=()=>{$("copied").hidden=false};
      try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();done()})}catch(e){ta.select();done()}};
    const v=$("csv"); if(v)v.onclick=descargarCSV;
    const d=$("del");
    if(d)d.onclick=()=>{$("delrow").innerHTML=`<span class="nota">¿Seguro? No se puede deshacer.</span><button class="btn btn--peligro btn--chico" id="del2">Sí, borrar</button><button class="btn btn--chico" id="cancel">Cancelar</button>`;
      $("del2").onclick=()=>{mem.registros=mem.registros.filter(r=>r.estado!=="enviado");save();render()};$("cancel").onclick=()=>render();};
  }
}
render();
sincronizar();
</script>
